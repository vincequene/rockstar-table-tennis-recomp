# Rockstar Table Tennis (PC recompilation) settings. Also editable in game with F1.
gpu_plugin = "xenos"

# Game language: 1 = English, 3 = German, 4 = French, 5 = Spanish, 6 = Italian
user_language = 1

# Internal resolution (the original game renders at 1280x720).
# 1 = 720p (original), 2 = 1440p, 3 = 4K (2160p). Use 1 if you see graphical glitches.
resolution_scale = 2

# Start in fullscreen (true) or windowed (false). Alt+Enter toggles in game.
fullscreen = true

# Texture filtering: 0 = original, 5 = 16x
anisotropic_override = 5

# Show the game status on Discord: true / false
discord_enabled = true

# Keyboard as a controller (works alongside the gamepad):
# arrows = D-pad, Enter = Start, Space = A, Backspace = B, Tab = Back
mnk_mode = true
keybind_dpad_up = "Up"
keybind_dpad_down = "Down"
keybind_dpad_left = "Left"
keybind_dpad_right = "Right"
keybind_rstick_up = ""
keybind_rstick_down = ""
keybind_rstick_left = ""
keybind_rstick_right = ""
keybind_start = "Return"
keybind_a = "Space"
keybind_b = "Backspace"
keybind_back = "Tab"
